services:
  postgres:
    # Same major as the managed server the installation runs against (18.6),
    # so a dump taken there restores here without a client/server version
    # mismatch, and so development never exercises a different major than
    # production. Bumping this major means recreating the volume: a newer
    # server refuses a data directory initialized by an older one.
    image: postgres:18-alpine
    container_name: craftstock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: craftstock
      POSTGRES_PASSWORD: craftstock
      POSTGRES_DB: craftstock
    ports:
      # Host port is configurable: a local PostgreSQL installation may already
      # hold 5432. Set POSTGRES_PORT in .env to move it.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Mounted at /var/lib/postgresql, not at .../data: from 18 on, the
      # official image keeps the cluster in a major-versioned subdirectory
      # (/var/lib/postgresql/18/docker) and refuses to start when it finds a
      # mount at the old path, rather than silently ignoring the data in it.
      - craftstock-postgres-data:/var/lib/postgresql
    healthcheck:
      # `pg_isready` only proves the server answers: it reports healthy even when
      # the role or the database does not exist. A real query is what tells us the
      # cluster was initialized as expected.
      test: ['CMD-SHELL', 'psql -U craftstock -d craftstock -c "SELECT 1" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  craftstock-postgres-data:
    name: craftstock-postgres-data
