name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  LOG_LEVEL: error
  DATABASE_URL: postgresql://craftstock:craftstock@localhost:5432/craftstock_test?schema=public
  # The env schema is validated when EnvModule is imported, so even the
  # module-wiring tests need a valid environment just to load the file. Every
  # other variable has a default; this one deliberately does not, and there is
  # no .env here — it is not committed. A throwaway value: the runner is
  # destroyed with the job, and no installation's real key may ever be written
  # down in this file.
  JWT_SECRET: ci-only-throwaway-signing-key-not-a-secret

jobs:
  ci:
    name: type-check, lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major as docker-compose.yml and as the managed server (18.6):
        # the e2e suite is worth little if it runs against a major nothing
        # else does.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: craftstock
          POSTGRES_PASSWORD: craftstock
          POSTGRES_DB: craftstock_test
        ports:
          - 5432:5432
        # A real query, not `pg_isready`: the latter reports healthy even when the
        # role or database is missing, which hides a broken cluster.
        options: >-
          --health-cmd "psql -U craftstock -d craftstock_test -c 'SELECT 1' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, which loads prisma.config.ts and
      # therefore needs DATABASE_URL (set at job level). The generated client is
      # not committed, so every step after this one depends on it.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Unit tests
        run: npm run test

      # The service container starts with an empty database, and nothing in the
      # e2e suite creates the schema: the specs drive real HTTP routes against
      # real tables. `deploy` rather than `dev` — it applies the committed
      # migrations and never generates one, so CI cannot quietly drift from
      # prisma/migrations. The seed is not needed: each spec creates and deletes
      # the rows it uses, including its own user.
      - name: Apply migrations
        run: npm run prisma:deploy

      - name: E2E tests
        run: npm run test:e2e
