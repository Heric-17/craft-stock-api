name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  LOG_LEVEL: error
  # Only needed to be syntactically valid, never reachable: the unit suite
  # never connects (it only validates the env schema in its module-wiring
  # specs), and the e2e suite's own Testcontainers globalSetup overwrites
  # this with its own throwaway Postgres's real connection string before any
  # e2e spec runs — see test/support/global-setup.ts.
  DATABASE_URL: postgresql://craftstock:craftstock@localhost:5432/craftstock_test?schema=public
  # The env schema is validated when EnvModule is imported, so even the
  # module-wiring tests need a valid environment just to load the file. Every
  # other variable has a default; this one deliberately does not, and there is
  # no .env here — it is not committed. A throwaway value: the runner is
  # destroyed with the job, and no installation's real key may ever be written
  # down in this file.
  JWT_SECRET: ci-only-throwaway-signing-key-not-a-secret

jobs:
  ci:
    name: type-check, lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, which loads prisma.config.ts and
      # therefore needs DATABASE_URL (set at job level). The generated client is
      # not committed, so every step after this one depends on it.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Unit tests
        run: npm run test:cov

      # No postgres service and no separate migrate step: Testcontainers'
      # globalSetup (test/support/global-setup.ts) starts its own throwaway
      # Postgres (same image/major as docker-compose.yml, for the same
      # version-parity reason documented there), applies the committed
      # migrations with `prisma migrate deploy` against it, and tears it down
      # afterwards. `ubuntu-latest` ships Docker as the host engine already,
      # so this needs no extra setup. Each spec creates and deletes the rows
      # it uses, including its own user — no seed required.
      - name: E2E tests
        run: npm run test:e2e:cov

      # Unit and e2e cover different layers by design (domain/application via
      # fakes, infrastructure/presentation via this real-Postgres e2e run —
      # see the comment on coverageThreshold in jest.config.js). Merging them
      # is what makes the uploaded artifact an honest whole-system number
      # instead of two reports that each look partial on their own.
      - name: Merge coverage reports
        if: always()
        run: node scripts/merge-coverage.js

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/merged/
            coverage/unit/
            coverage/e2e/
          # A failure before any test ran (e.g. type-check) leaves no coverage
          # to upload; that is not itself a reason to fail this step.
          if-no-files-found: ignore
          retention-days: 30
