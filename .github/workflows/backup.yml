name: Database backup

# Cron here is ALWAYS UTC. GitHub Actions has no notion of a local timezone and
# never applies one, which is a recurring source of confusion: the schedule
# below reads as 06:00 and fires at 03:00 in Porto Alegre, because that zone is
# UTC-3 all year (Brazil dropped daylight saving time in 2019). Changing the
# local hour means changing this expression AND the hour documented in
# docs/RECOVERY.md, which states both.
#
# workflow_dispatch is not only a convenience. GitHub disables scheduled
# workflows after 60 days without repository activity, and a manual run is what
# brings the schedule back — so this trigger is part of the routine, not an
# extra.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  # The client must never be older than the server: pg_dump refuses to dump a
  # newer server outright. The other direction is supported, so this is pinned
  # to a major at or above the managed server's (16 or 17 on the current
  # provider) rather than to its exact version. Bump it when the server is
  # upgraded past it — a mismatch fails the dump step with an explicit message
  # from pg_dump itself.
  PG_CLIENT_MAJOR_VERSION: '17'
  # Read twice below: by the upload, and by the run summary that tells whoever
  # opens the run how long the archive will still be there.
  ARTIFACT_RETENTION_DAYS: '30'

jobs:
  backup:
    name: dump and upload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Only the scripts under scripts/backup/ are needed; a full checkout is
      # cheap enough that narrowing it would buy nothing.
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image ships a PostgreSQL client, but which major version it
      # is changes with the image. Installing from the PostgreSQL project's own
      # apt repository makes the version an explicit decision instead of a
      # property of the image, and putting its bin directory first on PATH
      # keeps a pre-installed older client from winning.
      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_CLIENT_MAJOR_VERSION}"
          echo "/usr/lib/postgresql/${PG_CLIENT_MAJOR_VERSION}/bin" >> "$GITHUB_PATH"

      # Separate step on purpose: the PATH entry above only applies from the
      # next step on, so this is what proves the intended client is the one
      # that will run. It is also the first thing to look at when a version
      # mismatch breaks the dump.
      - name: Report client version
        run: pg_dump --version

      # The UTC timestamp goes in the file name and in the artifact name, so
      # one run never overwrites another's copy, and so a downloaded file still
      # says what it is after being moved somewhere else.
      - name: Name the archive
        id: archive
        run: |
          stamp="$(date -u +'%Y%m%d-%H%M%SZ')"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "path=backups/craftstock-$stamp.dump" >> "$GITHUB_OUTPUT"

      # PG_CLIENT_MODE=local is required, not preference: left at auto, the
      # scripts fall back to the client inside the docker-compose container,
      # and there is no compose on the runner. The variable is the one the
      # scripts already read — no script logic changes for this workflow.
      #
      # PGSSLMODE is read by libpq directly. The connection crosses the public
      # internet, and the scripts parse DATABASE_URL into host/port/user/dbname
      # and drop its query string, so an sslmode carried there would be lost.
      #
      # The script fails loudly on its own: it writes to a .partial file and
      # renames only after pg_dump exits clean, rejects an empty dump, and
      # reads the archive's table of contents back to prove it is not
      # truncated. Any of those exits non-zero, which fails this step and the
      # workflow — GitHub mails the owner when a scheduled run fails, which is
      # the whole alerting requirement. A backup that stops running quietly is
      # worse than no backup, because it leaves a false sense of protection.
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_CLIENT_MODE: local
          PGSSLMODE: require
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::The DATABASE_URL repository secret is not set; there is nothing to back up."
            exit 1
          fi
          bash scripts/backup/db-dump.sh --output '${{ steps.archive.outputs.path }}'

      # Destination: this workflow's own artifact store. DELIBERATE DECISION,
      # with two limitations known and accepted rather than overlooked —
      # retention is capped, and the copy is hosted by the same provider as the
      # code, so a single compromised account reaches both. It fits the life
      # cycle of this project, an academic work with a one-off demonstration.
      # Moving to external object storage is a change of destination, not of
      # routine: only this step changes.
      #
      # The archive contains password hashes and refresh tokens, and an
      # artifact inherits the repository's visibility — whoever can read the
      # repository can download it. That has to be re-evaluated before this
      # routine runs against real production data. Recorded in
      # docs/RECOVERY.md as well.
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: craftstock-db-${{ steps.archive.outputs.stamp }}
          path: ${{ steps.archive.outputs.path }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          # A missing file here would mean the dump step reported success
          # without producing anything. Fail rather than upload nothing and
          # leave an empty artifact looking like a backup.
          if-no-files-found: error
          # pg_dump already compressed the archive at level 9. Zipping it again
          # costs time and saves nothing.
          compression-level: 0

      # The row counts printed by the dump step are the reference for checking
      # a restore, and they stay in the run log. This summary only says what
      # was produced and for how long it will be downloadable.
      - name: Summarize
        run: |
          archive='${{ steps.archive.outputs.path }}'
          {
            printf '### Database backup\n\n'
            printf -- '- Archive: `%s`\n' "$(basename "$archive")"
            printf -- '- Size: %s\n' "$(du -h "$archive" | cut -f1)"
            printf -- '- Artifact: `craftstock-db-%s`, kept for %s days\n' \
              '${{ steps.archive.outputs.stamp }}' "$ARTIFACT_RETENTION_DAYS"
            printf -- '- Row counts per table are in the log of the dump step.\n'
          } >> "$GITHUB_STEP_SUMMARY"
